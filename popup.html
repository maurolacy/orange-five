<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pool Color Restorer</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>Pool Color</h1>
    <label class="toggle">
      <input type="checkbox" id="enabled" checked />
      <span>On</span>
    </label>
  </header>

  <p class="hint">Master Off bypasses everything. Each remap has its own enable. Higher selectivity = less spill.</p>

  <section id="orangeSection">
    <h2>
      <label class="section-toggle">
        <input type="checkbox" id="orangeEnabled" checked />
        Purple → orange (5-ball)
      </label>
    </h2>
    <label>
      Saturation
      <input type="range" id="orangeSat" min="0.3" max="1" step="0.01" />
      <output id="orangeSatOut"></output>
    </label>
    <label>
      Selectivity
      <input type="range" id="orangeSense" min="0" max="1" step="0.01" />
      <output id="orangeSenseOut"></output>
    </label>
  </section>

  <section id="pinkSection">
    <h2>
      <label class="section-toggle">
        <input type="checkbox" id="pinkEnabled" checked />
        Pink → purple (4-ball)
      </label>
    </h2>
    <label>
      Saturation
      <input type="range" id="pinkSat" min="0.2" max="1" step="0.01" />
      <output id="pinkSatOut"></output>
    </label>
    <label>
      Selectivity
      <input type="range" id="pinkSense" min="0" max="1" step="0.01" />
      <output id="pinkSenseOut"></output>
    </label>
  </section>

  <section id="cyanSection">
    <h2>
      <label class="section-toggle">
        <input type="checkbox" id="cyanEnabled" />
        Cyan → blue (2-ball)
      </label>
    </h2>
    <label>
      Saturation
      <input type="range" id="cyanSat" min="0.2" max="1" step="0.01" />
      <output id="cyanSatOut"></output>
    </label>
    <label>
      Selectivity
      <input type="range" id="cyanSense" min="0" max="1" step="0.01" />
      <output id="cyanSenseOut"></output>
    </label>
  </section>

  <footer>
    <button type="button" id="reset">Reset defaults</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
